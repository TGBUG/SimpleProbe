# server 端配置。权限 0600，不要进 Git。
#
# 改完这个文件后不用重启：systemctl reload probe-server（等价于 kill -HUP）。
# 若改错了，server 会保留旧配置继续跑，错误信息进日志。

# HTTP 监听地址。默认只监听回环——公网入口交给任意反向代理，
# 或者干脆不用代理（见下文"关于 TLS"）。
listen: "127.0.0.1:8080"

# SQLite 路径。目录要存在且对运行用户可写。
db: "/opt/simpleprobe/data/probe.db"

# 单个节点每分钟的上报次数上限，按节点计数（不按 IP——agent 很可能都在
# 同一个出口或反代后面）。留空即默认 60。
#
# 默认值刻意开得比"正常频率"宽得多：协议允许的最快间隔是 5s，也就是
# 12 次/分钟，再乘上 agent 单周期最多 3 次尝试，最坏合法情况是 36 次/分钟。
# 阈值一旦低于这个数，就会出现"server 接受一份它自己拒绝服务的配置"——
# 曾经写死 10/分钟，于是任何 interval < 6s 的节点都会每分钟必然吃 429。
#
# 它的职责是拦住失控的死循环（那种会打到几千次/分钟），不是访问控制：
# 能拿出 token 的人本来就有权上报这个节点的数据。
# report_per_minute: 60

# 节点身份的唯一真源：不落库、没有自注册入口。
# 顺序即面板展示顺序——刻意不排序，让你用书写顺序控制它。
#
# token 是明文。判断依据：能读到这个文件的人，能力已经远超一个
# 只用于写数据的 token。它泄露的最坏后果是"可以伪造监控数据"，
# 而架构里不存在任何能让 agent 执行命令的代码路径。
nodes:
  - id: web01                 # 只能用小写/大写字母、数字、点、下划线、连字符
    display_name: "Web 01"    # 留空则回落到 id
    token: "把 add-node.sh 生成的十六进制串填这里"
    # since 可选：纳入监控的起始日，用于裁剪在线率分母。
    # 不写则用数据库里的首次上报时间。
    # since: 2026-10-01
